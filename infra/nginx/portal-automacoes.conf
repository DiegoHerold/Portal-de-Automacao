# Portal de Automacoes atras do nginx (docs/visao-geral.md, "Endereco na intranet").
#
# No Linux, `sudo ./scripts/portal.sh nginx <nome>` grava este arquivo ja ajustado.
# Com o nginx em outra maquina, copie-o para o nginx e troque:
#   - portaldeautomacoes.intranet.biason.net pelo nome do Portal;
#   - 127.0.0.1 nos dois "server" abaixo pelo IP da maquina do Portal, e ponha o IP
#     do nginx em PORTAL_PROXY_IPS no backend/.env do Portal;
#   - se a API estiver com HTTPS (PORTAL_TLS_CERT), "http://portal_automacoes_api"
#     por "https://portal_automacoes_api".

# WebSocket (tempo real e Agents): repassa o pedido de upgrade; sem ele, mantem a conexao viva.
map $http_upgrade $portal_automacoes_upgrade {
    default upgrade;
    ''      '';
}

upstream portal_automacoes_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream portal_automacoes_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name portaldeautomacoes.intranet.biason.net;

    # Pacotes de automacao: MAX_UPLOAD_SIZE_MB do backend/.env (200) com folga.
    client_max_body_size 256m;

    access_log /var/log/nginx/portal-automacoes.access.log;
    error_log /var/log/nginx/portal-automacoes.error.log;

    # API (tudo dela fica em /api/), incluindo WebSocket e telas ao vivo (SSE).
    location /api/ {
        proxy_pass http://portal_automacoes_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # So o IP de quem conectou no nginx; a API confia nele (PORTAL_PROXY_IPS).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $portal_automacoes_upgrade;
        # Ao vivo e uploads passam direto, sem o nginx guardar tudo antes.
        proxy_buffering off;
        proxy_request_buffering off;
        # Conexoes longas: telas ao vivo e o canal dos Agents.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Telas (Next.js).
    location / {
        proxy_pass http://portal_automacoes_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }
}
